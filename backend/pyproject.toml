[project]
name = "studyhub"
version = "1.0.0"
description = "Studio dei corsi UniVR: Moodle, registrazioni trascritte, lezioni interattive e allenamento all'esame con Claude e Gemini"
readme = "README.md"
authors = [
    { name = "valemond06-svg" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.156.7",
    "faster-whisper>=1.2.1",
    "fsrs>=6.3.2",
    "genanki>=0.13.1",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "imageio-ffmpeg>=0.6.0",
    "markdownify>=1.2.3",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlite-vec>=0.1.9",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
studyhub = "studyhub.cli:app"
