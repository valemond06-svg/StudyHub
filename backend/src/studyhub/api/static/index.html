function bindLessonMedia(root, t) {
  if (!root || !t) return;
  root.querySelectorAll("[data-open-doc]").forEach((b) => (b.onclick = () => openViewer(+b.dataset.openDoc, +b.dataset.p)));
  root.querySelectorAll("[data-open-lec]").forEach((b) => (b.onclick = () => {
    if (confirm("Vuoi aprire la video lezione completa al minuto indicato?")) {
      setView("lessons", { lecture: +b.dataset.openLec, t: +b.dataset.t });
    }
  }));
  root.querySelectorAll("[data-play-sec]").forEach((b) => {
    b.onclick = () => {
      const sec = +b.dataset.playSec;
      if (audio.src.includes(`/media/${t.lecture_id}/audio.opus`) && !audio.paused) {
        audio.pause();
        b.innerHTML = `▶ Ascolta spiegazione audio (▶ ${fmt(sec)})`;
      } else {
        audio.src = `/media/${t.lecture_id}/audio.opus`;
        audio.currentTime = sec;
        audio.play().then(() => {
          b.innerHTML = `❚❚ In riproduzione (▶ ${fmt(sec)})`;
        }).catch(() => {
          alert("Audio non disponibile per questa lezione.");
        });
      }
    };
  });
}

async function askTutor_(context, mode, q) {

  try { const r = await postJ(`/api/study/topics/${t.id}/ask`, { question: q, context, mode }); if (les) { les.helper = { ...les.helper, loading: false, answer: r.answer_md }; renderLesson(); } }
  catch (e) { if (les) { les.helper = { ...les.helper, loading: false, error: e.message }; renderLesson(); } }
}

// --- sessione guidata ---
async function startRun(cid, minutes, focus = null) {
  stopPrepPoll();
  $("studyBody").innerHTML = '<p class="muted"><span class="spin"></span> Preparo la sessione…</p>';
  try {
    const s = await postJ(`/api/study/${cid}/sessions`, { minutes, focus_topic: focus });
    run = { ...s, i: 0, combo: 0, t0: Date.now(), phase: "ask", sel: null, res: null, askedAt: Date.now() };
    renderRun();
  } catch (e) { alert(e.message); loadStudyCourse(cid); }
}
function runNext() {
  run.i++; run.phase = "ask"; run.sel = null; run.res = null; run.paper = false; run.askedAt = Date.now();
  if (run.i >= run.entries.length) return finishRun();
  renderRun();
}
function runHead() {
  const n = run.entries.length, el = Math.floor((Date.now() - run.t0) / 1000);
  return `<div class="runbar"><button class="btn sm ghost" id="rStop">Termina</button>
    <div class="meter"><i style="width:${100 * run.i / n}%"></i></div><span class="muted small">${Math.min(run.i + 1, n)}/${n}</span>
    <span class="time" id="runT">${fmt(el)} / ${run.minutes}:00</span>${run.combo >= 3 ? `<span class="combo">🔥 ×${run.combo}</span>` : ""}<span class="xp">${run.xp} XP</span></div>`;
}
function renderRun() {
  const e = run.entries[run.i], body = $("studyBody");
  body.className = "study run";
  $("title").textContent = "Sessione"; $("subtitle").textContent = shortName((COURSES.find((c) => c.id === run.course_id) || {}).fullname || "");
  clearInterval(runClock); runClock = setInterval(() => { const t = $("runT"); if (!t || !run) return clearInterval(runClock); t.textContent = `${fmt((Date.now() - run.t0) / 1000)} / ${run.minutes}:00`; }, 1000);
  if (e.t === "scheda") {  // argomento nuovo: lezione interattiva, poi le domande della sessione
    if (les && les.tid === e.topic) { les.head = runHead(); return renderLesson(); }
    return openLesson(e.topic, { head: runHead(), onDone: runNext });
  } else {
    const q = e.question, t = run.topics[q.topic_id] || {};
    const tag = e.boss ? '<span class="pill warn">⚔ Boss finale · XP doppi</span>' : e.retry ? '<span class="pill warn">Riprova: l\'avevi sbagliata</span>' : "";
    const opts = q.kind === "multipla" ? q.options : q.kind === "vero_falso" ? ["Vero", "Falso"] : null;
    const val = (j) => q.kind === "vero_falso" ? (j === 0 ? 1 : 0) : j;
    const r = run.res, done = run.phase === "result";
    let answerUi;
    if (opts) {
      answerUi = `<div class="opts">${opts.map((o, j) => {
        let cls = run.sel === val(j) ? "sel" : "";
        if (done && r && r.correct != null) cls = val(j) === r.correct ? "right" : run.sel === val(j) ? "wrong" : "";
        return `<button class="opt ${cls}" data-o="${val(j)}" ${done ? "disabled" : ""}><kbd>${j + 1}</kbd><span>${mdInline(o)}</span></button>`; }).join("")}</div>`;
    } else if (!run.paper) {
      answerUi = `<textarea id="rText" rows="${q.kind === "esercizio" ? 8 : q.kind === "aperta" ? 6 : 3}" ${done ? "disabled" : ""} placeholder="${q.kind === "esercizio" ? "Scrivi passaggi e risultato (le formule anche in testo semplice: x^2, sqrt(2), int_0^1 …)" : "Rispondi con parole tue, come all'esame"}">${esc(run.text || "")}</textarea>
        ${done ? "" : '<div class="small"><a id="rPaper">Ho svolto su carta / a mente: confronto io con la soluzione</a></div>'}`;
    } else answerUi = '<div class="muted small">Svolgi su carta, poi scegli quanto sei sicuro: vedrai la soluzione e ti valuterai sui criteri.</div>';
    const conf = done ? "" : `<div class="muted small">Quanto sei sicuro? (invia la risposta)</div><div class="conf">
      <button class="btn" data-conf="3">Sicuro</button><button class="btn" data-conf="2">Credo di sì</button><button class="btn" data-conf="1">Tiro a indovinare</button></div>`;
    body.innerHTML = runHead() + `<div class="card qcard"><div class="tags"><span class="pill">${KIND[q.kind]}</span><span class="pill">${DIFF[q.difficulty]}</span>${tag}<span class="muted small">${esc(t.name || "")}</span></div>
      <div class="md prompt">${md(q.prompt_md)}</div>${qMediaBoxHtml(q)}${answerUi}${conf}<div id="rOut">${done ? resultHtml() : ""}</div></div>`;
    body.querySelectorAll("[data-o]").forEach((b) => (b.onclick = () => { run.sel = +b.dataset.o; renderRun(); }));
    body.querySelectorAll("[data-conf]").forEach((b) => (b.onclick = () => submitRun(+b.dataset.conf)));
    $("rText")?.addEventListener("input", (ev) => (run.text = ev.target.value));

async function submitRun(conf) {
  const e = run.entries[run.i], q = e.question, idx = run.i, seconds = (Date.now() - run.askedAt) / 1000;
  const isChoice = q.kind === "multipla" || q.kind === "vero_falso";
  if (isChoice && run.sel == null) return alert("Scegli prima una risposta.");
  if (!isChoice && !run.paper && !(run.text || "").trim()) return alert("Scrivi la risposta, oppure scegli «Ho svolto su carta».");
  run.conf = conf; run.phase = "result";
  if (isChoice) {
    run.res = { pending: true }; renderRun();
    run.res = await postJ(`/api/study/sessions/${run.id}/answer`, { idx, choice: run.sel, confidence: conf, seconds });
    return afterAnswer();
  }
  run.res = { pending: true, ...(await postJ(`/api/study/sessions/${run.id}/reveal/${idx}`)) };
  if (run.paper) { run.res.self = true; return renderRun(); }
  renderRun();
  try { run.res = await postJ(`/api/study/sessions/${run.id}/answer`, { idx, text: run.text, confidence: conf, seconds }); afterAnswer(); }

  if (boxes.length) body.self_criteria = boxes.map((b) => b.checked); else body.self_score = +document.querySelector("[name=selfScore]:checked")?.value || 0;
  run.res = await postJ(`/api/study/sessions/${run.id}/answer`, body); afterAnswer();
}

  const r = run.res; run.xp += r.xp; run.entries[run.i].done = true;

}
function resultHtml() {

  const crit = (r.rubric || []);
  let head = "";

    const self = crit.length ? `<ul class="crit">${crit.map((c, i) => `<li><label><input type="checkbox" data-crit="${i}"><span>${mdInline(c)}</span></label></li>`).join("")}</ul>`
      : `<div class="conf"><label class="btn"><input type="radio" name="selfScore" value="0"> Sbagliata</label><label class="btn"><input type="radio" name="selfScore" value="0.5"> Parziale</label><label class="btn"><input type="radio" name="selfScore" value="1"> Giusta</label></div>`;
    return `<div class="sol">${head}<div class="md">${md(r.answer_md)}</div>${crit.length ? '<div class="small muted">Spunta solo i criteri che la tua risposta soddisfa davvero:</div>' : ""}${self}

function shrinkImage(file) {  // foto ridotte nel browser: lato lungo 1568 px, JPEG
  return new Promise((ok, ko) => { const img = new Image(); img.onload = () => {
    const k = Math.min(1, 1568 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    ok(c.toDataURL("image/jpeg", 0.85)); URL.revokeObjectURL(img.src); }; img.onerror = ko; img.src = URL.createObjectURL(file); });
}

let currentVideoMode = "panopto";

function renderStage(mode) {
  if (!lec) { $("stage").innerHTML = '<div class="empty">Scegli una lezione dall\'elenco</div>'; return; }
  currentVideoMode = mode || lec.default_mode || "panopto";

  const hasSlides = lec.has_local_slides || (slides && slides.length > 0);
  const hasDrive = lec.videos && lec.videos.length > 0;
  const hasPanopto = Boolean(lec.panopto_embed_url || lec.panopto_id);
  const hasMoodle = Boolean(lec.media_url);

  // Aggiorna pulsante commutazione tra Slide e Video
  if (hasSlides && (hasPanopto || hasMoodle || hasDrive)) {
    $("videoBtn").hidden = false;
    $("videoBtn").textContent = (currentVideoMode === "slides") ? "Guarda Video" : "Mostra Slide";
  } else {
    $("videoBtn").hidden = true;
  }

async function openLecture(id) {

  $("subtitle").textContent = lec.title;
  document.querySelectorAll(".li").forEach((e) => e.classList.toggle("on", +e.dataset.id === id));
  segs = lec.transcript.segments || []; slides = lec.slides || []; silences = lec.silences || [];
  $("p-transcript").innerHTML = segs.length
    ? `<div class="faint small" style="padding:8px 16px">Trascrizione ${esc(lec.transcript.source || "")}</div>` + segs.map((s, i) => `<div class="tline" data-i="${i}"><time>${fmt(s.start)}</time>${esc(s.text)}</div>`).join("")

  $("strip").innerHTML = slides.map((s, i) => `<img loading="lazy" data-i="${i}" src="/media/${id}/slides/${s.file}" title="${fmt(s.start)}">`).join("");

function drawTicks() {
  const bar = $("bar"); bar.querySelectorAll(".tick").forEach((t) => t.remove());
  const dur = lec?.duration || audio.duration; if (!dur) return;
  for (const s of slides) { const t = document.createElement("div"); t.className = "tick"; t.style.left = (100 * s.start / dur) + "%"; bar.append(t); }
}
let lastSeg = -1, lastSlide = -1;
function update(force) {
  if (!lec) return;
  const t = audio.currentTime, dur = audio.duration || lec.duration || 0;
  $("time").textContent = `${fmt(t)} / ${fmt(dur)}`;
  $("fill").style.width = dur ? (100 * t / dur) + "%" : "0";
  const si = find(slides, t);
  if (si !== lastSlide || force) {
    lastSlide = si; const img = $("slide"); if (img && si >= 0) img.src = `/media/${lec.id}/slides/${slides[si].file}`;
    if (!$("strip").hidden) { $("strip").querySelectorAll("img").forEach((e) => e.classList.toggle("cur", +e.dataset.i === si)); $("strip").querySelector("img.cur")?.scrollIntoView({ block: "nearest", inline: "center" }); }
  }
  const gi = find(segs, t);
  if ((gi !== lastSeg || force) && !$("p-transcript").hidden) {
    lastSeg = gi; $("p-transcript").querySelector(".tline.cur")?.classList.remove("cur");
    const el = $("p-transcript").querySelector(`.tline[data-i="${gi}"]`);
    if (el) { el.classList.add("cur"); el.scrollIntoView({ block: "center", behavior: force ? "auto" : "smooth" }); }
  }
}
(function tick() {  // salto dei silenzi, controllato a ogni frame
  if (!audio.paused && skipSilences && silences.length) {
    const t = audio.currentTime;
    for (const [a, b] of silences) { if (a > t) break; if (t >= a + 0.25 && t < b - 0.35) { audio.currentTime = b - 0.25; break; } }
  }
  requestAnimationFrame(tick);
})();
function seek(t) { audio.currentTime = Math.max(0, t); update(true); }
audio.ontimeupdate = () => update(false);
audio.onloadedmetadata = () => { drawTicks(); update(true); };
audio.onplay = () => ($("play").textContent = "❚❚");

$("bar").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * (audio.duration || 0)); };

document.addEventListener("keydown", (e) => {
  if (view !== "lessons" || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName) || !$("drawer").hidden || !$("viewer").hidden) return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  else if (e.key === "ArrowLeft") seek(audio.currentTime - 10);

  else if (e.key === "]" || e.key === "[") { const i = RATES.indexOf(+$("rate").value) + (e.key === "]" ? 1 : -1); if (RATES[i]) { $("rate").value = RATES[i]; $("rate").onchange(); } }

async function loadNotes() {
  if (!lec) return;
  const id = lec.id;
  const [n, st, tops] = await Promise.all([getJ(`/api/lectures/${id}/notes`), getJ("/api/ai/status"), getJ(`/api/lectures/${id}/topics`).catch(() => [])]);
  if (!lec || lec.id !== id) return;
  const learnBar = tops.length ? `<div class="card learn" style="margin-top:12px;padding:12px 14px"><div class="t"><div class="muted small">IMPARA QUESTA LEZIONE IN MODO INTERATTIVO</div>
      <div class="chips" style="margin-top:6px">${tops.map((t) => `<span class="chip" data-learn-t="${t.id}">${t.learned ? "✓ " : ""}${esc(t.name)}</span>`).join("")}</div></div></div>` : "";
  const job = st.jobs.find((j) => j.target_id === id && (j.status === "in_coda" || j.status === "in_corso"));
  const err = st.jobs.find((j) => j.target_id === id && j.status === "errore");
  if (n.exists) {
    $("p-notes").innerHTML = learnBar + `<div class="faint small" style="margin-top:10px">${esc(n.model)} · ${n.created_at.slice(0, 10)} · <a href="/api/lectures/${id}/notes.pdf">PDF</a></div>` + md(n.md) +
      (n.flashcard.length ? `<h2>Flashcard (${n.flashcard.length})</h2><div class="fcards">${n.flashcard.map((c) => `<div class="fc"><div>${mdInline(c.fronte)}</div><div class="back">${md(c.retro)}</div></div>`).join("")}</div>` : "");
  } else if (job) {
    $("p-notes").innerHTML = `<div class="cta"><b>${job.status === "in_corso" ? "⏳ Claude sta elaborando la lezione" : "In coda"}</b><p>Di solito 1-3 minuti.${st.paused_reason ? " Coda in pausa: " + esc(st.paused_reason) : ""}</p></div>`;
  } else {
    $("p-notes").innerHTML = `<div class="cta"><b>Appunti non ancora generati</b><p>Claude legge trascrizione e appunti scritti e prepara appunti, flashcard e domande. Circa il 5-7% della finestra di 5 ore.</p>
      ${err ? `<p class="small" style="color:var(--warn)">Ultimo tentativo fallito: ${esc(err.message || "")}</p>` : ""}<button class="btn primary" id="gen">Genera appunti</button></div>`;
    $("gen").onclick = async () => { await postJ(`/api/lectures/${id}/notes`); loadNotes(); };
  }
  $("p-notes").querySelectorAll("[data-learn-t]").forEach((c) => (c.onclick = () => { setView("study"); openLesson(+c.dataset.learnT); }));
  clearTimeout(loadNotes.timer);
  if (job) loadNotes.timer = setTimeout(() => { loadNotes(); refreshFoot(); if (view === "lessons") loadLectureList(); }, 4000);
}

async function loadQuiz() {
  if (!lec) { $("p-quiz").innerHTML = '<div class="empty">Apri una lezione.</div>'; return; }
  const id = lec.id, list = await getJ(`/api/lectures/${id}/quizzes`);

  $("p-quiz").innerHTML = (list.length ? list.map((q) => `<div class="qitem" data-q="${q.id}"><span>${esc(q.title)}</span><span class="muted small">${q.best != null ? Math.round(q.best * 100) + "%" : "da fare"}</span></div>`).join("") : "") +
    `<div class="cta"><b>Quiz di 10 domande</b><p>Generato dagli appunti AI. Crocette corrette in locale, risposte aperte con Haiku.</p><button class="btn primary" id="qGen">Genera quiz</button></div>`;
  $("qGen").onclick = async () => { $("qGen").disabled = true; $("qGen").textContent = "⏳ Preparo le domande…";
    try { const r = await postJ(`/api/lectures/${id}/quiz?n=10`); openQuiz(r.id); } catch (e) { alert(e.message); loadQuiz(); } };
  $("p-quiz").querySelectorAll("[data-q]").forEach((el) => (el.onclick = () => openQuiz(+el.dataset.q)));

async function openQuiz(qid) {
  const q = await getJ(`/api/quizzes/${qid}`), box = $("p-quiz");
  box.innerHTML = `<p><button class="btn sm ghost" id="qBack">← Quiz</button></p><h3>${esc(q.title)}</h3>` + q.questions.map((d, i) => {
    const body = d.tipo === "multipla" ? d.opzioni.map((o, j) => `<label><input type="radio" name="q${i}" value="${j}"><span>${mdInline(o)}</span></label>`).join("")
      : d.tipo === "vero_falso" ? `<label><input type="radio" name="q${i}" value="1"> Vero</label><label><input type="radio" name="q${i}" value="0"> Falso</label>`
      : `<textarea name="q${i}" rows="${d.tipo === "esercizio" ? 5 : 3}" placeholder="La tua risposta"></textarea>`;
    return `<div class="q" id="qq${i}"><div class="muted small">${i + 1} · ${d.tipo.replace("_", "/")}</div><div class="md">${md(d.testo_md)}</div>${body}</div>`;
  }).join("") + `<button class="btn primary" id="qSubmit">Consegna</button>`;
  $("qBack").onclick = loadQuiz;
  $("qSubmit").onclick = async () => {
    const answers = q.questions.map((d, i) => d.tipo === "multipla" || d.tipo === "vero_falso"
      ? ((c) => (c ? +c.value : null))(box.querySelector(`input[name=q${i}]:checked`)) : box.querySelector(`textarea[name=q${i}]`).value);
    $("qSubmit").disabled = true; $("qSubmit").textContent = "⏳ Correggo…";
    try {
      const r = await postJ(`/api/quizzes/${qid}/submit`, { answers });
      r.results.forEach((res, i) => { const el = $("qq" + i), d = q.questions[i];
        el.classList.add(res.punteggio >= 0.99 ? "ok" : "ko");
        el.insertAdjacentHTML("beforeend", `<div class="fb md"><b>${res.punteggio >= 0.99 ? "Corretta" : res.punteggio > 0 ? res.punteggio + " punti" : "Sbagliata"}</b>` +
          (d.tipo === "multipla" && res.corretta >= 0 ? ` · giusta: ${String.fromCharCode(65 + res.corretta)}` : "") + (d.tipo === "vero_falso" ? ` · era ${res.corretta ? "vero" : "falso"}` : "") +
          (res.feedback_md ? md(res.feedback_md) : "") + md(res.soluzione_md) + (d.inizio_s != null ? ` <span class="ts" data-t="${d.inizio_s}">▶ ${fmt(d.inizio_s)}</span>` : "") + "</div>"); });
      $("qSubmit").outerHTML = `<div class="card" style="padding:14px"><b>${r.score} / ${r.max_score}</b> · ${Math.round(100 * r.score / r.max_score)}%</div>`;
    } catch (e) { alert(e.message); $("qSubmit").disabled = false; $("qSubmit").textContent = "Consegna"; }
  };
}

function botBubble(text, sources, cited, outside) {
  const box = document.createElement("div"); box.className = "msg bot md";
  box.innerHTML = (outside ? '<div class="small" style="color:var(--warn)">Il materiale del corso non copre del tutto la domanda.</div>' : "") +
    md(text).replace(/\[(\d{1,2})\]/g, (m, n) => sources.find((s) => s.n === +n) ? `<span class="cite" data-src="${n}">${n}</span>` : m);
  const used = sources.filter((s) => cited.includes(s.n));
  if (used.length) box.insertAdjacentHTML("beforeend", `<div class="srcs">${used.map((s) => `<a data-src="${s.n}">[${s.n}] ${esc(s.title || "")} · ${esc(s.where)}</a>`).join("")}</div>`);
  box.querySelectorAll("[data-src]").forEach((el) => (el._src = sources.find((s) => s.n === +el.dataset.src)));
  return box;
}
function renderChat(th) {
  const chat = $("tChat"); chat.innerHTML = "";
  if (!th || !th.messages.length) {
    chat.innerHTML = `<div class="empty" style="margin:auto"><div style="font-size:15px;color:var(--ink);font-weight:600">Chiedi al tuo materiale</div>
      <p>Risponde solo da appunti, PDF e trascrizioni, con le fonti cliccabili.${tMode === "socratico" ? " In modalità socratica ti guida con domande." : ""}</p>
      <div class="suggest">${EXAMPLES.map((e) => `<button class="btn sm" data-ex="${esc(e)}">${esc(e)}</button>`).join("")}</div></div>`;
    return;
  }
  for (const m of th.messages) {
    if (m.role === "user") { const d = document.createElement("div"); d.className = "msg user"; d.textContent = m.content; chat.append(d); }
    else chat.append(botBubble(m.content, m.citations, [...m.content.matchAll(/\[(\d{1,2})\]/g)].map((x) => +x[1])));
  }
  chat.scrollTop = chat.scrollHeight;
}
async function askTutor() {
  const q = $("tQ").value.trim(); if (!q || $("tSend").disabled) return;
  $("tSend").disabled = true; $("tQ").value = "";
  const chat = $("tChat");
  if (chat.querySelector(".empty")) chat.innerHTML = "";
  const u = document.createElement("div"); u.className = "msg user"; u.textContent = q; chat.append(u);
  const wait = document.createElement("div"); wait.className = "msg bot muted"; wait.textContent = "Cerco nel materiale…"; chat.append(wait);
  chat.scrollTop = chat.scrollHeight;
  try {
    if (!tThread) { const cid = $("tCourse").value; tThread = await postJ("/api/tutor/threads", { course_id: cid ? +cid : null, mode: tMode }); }
    const r = await postJ(`/api/tutor/threads/${tThread.id}/ask`, { question: q });
    wait.replaceWith(botBubble(r.answer, r.sources, r.cited, r.outside));
    tThread = await getJ(`/api/tutor/threads/${tThread.id}`);
    refreshFoot();
  } catch (e) { wait.className = "msg bot"; wait.innerHTML = `<span style="color:var(--warn)">${esc(e.message)}</span>`; $("tQ").value = q; }
  finally { $("tSend").disabled = false; chat.scrollTop = chat.scrollHeight; }
}

async function rate(r) {

function showPage(p) { vPage = Math.min(vPages, Math.max(1, p)); $("vImg").src = `/api/docs/${vDoc}/page/${vPage}.png`;

function toast(msg, type = 'info') {

// ============================================================== STUDYTOK FEED (Shorts / Micro-Concetti)
let feedCards = [], feedIdx = 0, feedCourse = store.get("feedCourse", ""), feedTrickOpen = false;
let consecutiveScrolls = 0, showDosso = false;

async function loadFeed(opts = {}) {
  const body = $("feedBody");
  if (!body) return;
  // Anti-Zapping fix: default to the first active course instead of empty string!
  if (!feedCourse && activeCourses().length) {
    feedCourse = String(activeCourses()[0].id);
    store.set("feedCourse", feedCourse);
  }
  body.innerHTML = '<div class="muted" style="text-align:center;padding:40px"><span class="spin"></span> Caricamento StudyTok Feed...</div>';
  try {
    const url = "/api/feed" + (feedCourse ? "?course_id=" + feedCourse : "");
    const res = await getJ(url);
    feedCards = res.shorts || [];
    feedIdx = 0;
    consecutiveScrolls = 0;
    showDosso = false;
    feedTrickOpen = false;
    renderFeed();
  } catch (err) {
    body.innerHTML = `<div class="card" style="color:var(--warn)">Errore nel caricamento del feed: ${esc(err.message)}</div>`;
  }
}

function renderFeed() {
  const body = $("feedBody");
  if (!body) return;
  if (!feedCards.length) {
    body.innerHTML = `<div class="card" style="text-align:center;padding:40px">
      <h3>Nessuno Short disponibile per questo filtro</h3>
      <p class="muted">Seleziona un altro corso o torna a 'Tutti i corsi'.</p>
      <div style="margin-top:12px"><button class="btn primary sm" onclick="feedCourse='';store.set('feedCourse','');loadFeed();">Mostra tutti i corsi</button></div>
    </div>`;
    return;
  }

  // Anti-Zapping: Render Chip Bar with 1..5 numbers
  const coursesList = activeCourses();
  const chipsHtml = `
    <div class="feed-chip-bar">
      <button class="feed-chip ${!feedCourse ? 'on' : ''}" data-fc=""><kbd>0</kbd> Mix Globale</button>
      ${coursesList.map((c, i) => `
        <button class="feed-chip ${String(c.id) === String(feedCourse) ? 'on' : ''}" data-fc="${c.id}">
          <kbd>${i + 1}</kbd> ${esc(shortName(c.fullname))}
        </button>
      `).join("")}
    </div>
  `;

  // Dosso Artificiale check (every 5 cards scrolled without doing an exercise)
  if (showDosso) {
    const currentCard = feedCards[feedIdx];
    body.innerHTML = `
      ${chipsHtml}
      <div class="dosso-overlay">
        <span style="font-size:38px">🛑</span>
        <h3>Dosso Artificiale: Hai visto 5 concetti!</h3>
        <div style="font-size:14.5px;color:#e0e7ff;line-height:1.55;max-width:500px;margin:0 auto">
          Scorrere in sequenza dà una rapida scarica di dopamina, ma all'esame scritto serve <b>l'automatismo procedurale della mano</b>.<br>
          Fermati 3 minuti per fare una micro-sfida su carta prima di continuare a scorrere.
        </div>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:10px;flex-wrap:wrap">
          <button class="btn primary" id="dossoPcpBtn">✍️ Fai la sfida Carta e Penna (3 min) →</button>
          <button class="btn ghost" id="dossoPassBtn" style="color:#fff;border-color:rgba(255,255,255,0.4)">Continua a scorrere comunque ›</button>
        </div>
      </div>
    `;
    $("dossoPcpBtn")?.addEventListener("click", () => {
      showDosso = false; consecutiveScrolls = 0;
      openLesson(currentCard.topic_id);
    });
    $("dossoPassBtn")?.addEventListener("click", () => {
      showDosso = false; consecutiveScrolls = 0;
      renderFeed();
    });
    bindFeedChips(body);
    return;
  }

  const card = feedCards[feedIdx];
  const total = feedCards.length;

  // Single Dominant Media element (Fix Sovraccarico Visivo)
  let mediaHtml = "";
  if (card.widget) {
    mediaHtml = `<div class="short-widget-target" id="shortWidgetArea"></div>`;
  } else if (card.slide) {
    mediaHtml = `
      <div class="short-media-box">
        <img src="/api/docs/${card.slide.doc_id}/page/${card.slide.page}.png" class="short-slide-img" alt="Slide del corso" loading="lazy">
      </div>`;
  }

  // Audio pill: compact and high-contrast
  let audioHtml = "";
  if (card.audio) {
    audioHtml = `
      <div class="lsn-media-player" style="margin:6px 0 10px">
        <button type="button" class="lsn-play-btn" id="feedAudioBtn" data-play-sec="${card.audio.start_s}" data-lec="${card.audio.lecture_id}">
          ▶ Ascolta i 25s chiave del prof (${fmt(card.audio.start_s)})
        </button>
        <span class="small muted" style="flex:1">${esc(card.audio.lecture_title)}</span>
      </div>`;
  }

  // Exam trick: folded by default behind Space or click
  let trickHtml = "";
  if (card.exam_trick) {
    trickHtml = `
      <div class="short-trick-box" id="feedTrickToggle">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <b style="color:var(--warn)">💡 ${card.archetipo_nome ? esc(card.archetipo_nome) + " · " : ""}Tranello d'Esame</b>
          <span class="small faint">${feedTrickOpen ? "▲ Comprimi" : "▼ Svela (spazio)"}</span>
        </div>
        ${feedTrickOpen ? `<div class="md" style="margin-top:8px">${md(card.exam_trick)}</div>` : ""}
      </div>`;
  }

  body.innerHTML = `
    ${chipsHtml}
    <div class="feed-filter-bar">
      <span class="feed-counter">📱 Short ${feedIdx + 1} di ${total}</span>
      <span class="small muted">Scorri con [↓] o [↑] · [Spazio] per audio/tranello</span>
    </div>

    <div class="short-card" id="activeShortCard">
      <div class="short-card-header">
        <span class="short-card-badge">📘 ${esc(card.course_name)}</span>
        <span class="pill primary" style="font-size:11px">⚡ Concept Bite</span>
      </div>
      <div class="short-card-body">
        <h2 class="short-card-title">${esc(card.title)}</h2>
        ${card.hook_md ? `<div class="short-hook-box"><b style="color:var(--accent)">🤖 The Robotics Lens:</b><div class="md" style="margin-top:4px">${md(card.hook_md)}</div></div>` : ""}
        ${mediaHtml}
        ${audioHtml}
        ${trickHtml}
      </div>
      <div class="short-footer">
        <button class="btn primary sm" id="feedOpenLab">🕹️ Apri Lab Completo →</button>
        ${card.has_pcp ? `<button class="btn sm" id="feedOpenPcp">✍️ Sfida Carta e Penna</button>` : ""}
        <button class="btn sm ghost" id="feedNextSmall">Avanti (↓) ›</button>
      </div>
    </div>

    <div class="short-nav-bar">
      <button class="short-nav-btn" id="feedPrevBtn" ${feedIdx === 0 ? "disabled" : ""} title="Precedente (Freccia Su / K)">▲</button>
      <button class="short-nav-btn primary" id="feedNextBtn" ${feedIdx >= total - 1 ? "disabled" : ""} title="Prossimo (Freccia Giù / J)">▼</button>
    </div>
  `;

  if (card.widget && $("shortWidgetArea")) {
    StudyHubEngines.renderWidget($("shortWidgetArea"), card.widget);
  }

  bindFeedChips(body);

  $("feedNextBtn")?.addEventListener("click", nextFeedCard);
  $("feedNextSmall")?.addEventListener("click", nextFeedCard);
  $("feedPrevBtn")?.addEventListener("click", prevFeedCard);

  $("feedTrickToggle")?.addEventListener("click", () => {
    feedTrickOpen = !feedTrickOpen;
    renderFeed();
  });

  $("feedOpenLab")?.addEventListener("click", () => {
    consecutiveScrolls = 0;
    openLesson(card.topic_id);
  });

  $("feedOpenPcp")?.addEventListener("click", () => {
    consecutiveScrolls = 0;
    openLesson(card.topic_id);
  });

  $("feedAudioBtn")?.addEventListener("click", (e) => {
    const sec = +e.currentTarget.dataset.playSec;
    const lecid = e.currentTarget.dataset.lec;
    if (audio.src.includes(`/media/${lecid}/audio.opus`) && !audio.paused) {
      audio.pause();
      e.currentTarget.innerHTML = `▶ Ascolta i 25s chiave del prof (${fmt(sec)})`;
    } else {
      audio.src = `/media/${lecid}/audio.opus`;
      audio.currentTime = sec;
      audio.play().then(() => {
        e.currentTarget.innerHTML = `❚❚ In riproduzione (${fmt(sec)})`;
      }).catch(() => {
        alert("Audio non disponibile per questa registrazione.");
      });
    }
  });
}

function bindFeedChips(root) {
  root.querySelectorAll("[data-fc]").forEach(btn => {
    btn.onclick = () => {
      feedCourse = btn.dataset.fc;
      store.set("feedCourse", feedCourse);
      loadFeed();
    };
  });
}

function nextFeedCard() {
  if (feedIdx < feedCards.length - 1) {
    consecutiveScrolls++;
    if (consecutiveScrolls >= 5) {
      showDosso = true;
      audio.pause();
      renderFeed();
      return;
    }
    feedIdx++;
    feedTrickOpen = false;
    audio.pause();
    renderFeed();
  }
}

function prevFeedCard() {
  if (feedIdx > 0) {
    feedIdx--;
    feedTrickOpen = false;
    audio.pause();
    renderFeed();
  }
}

// Keyboard shortcuts for StudyTok
document.addEventListener("keydown", (e) => {
  if (view !== "feed" || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (e.key === "ArrowDown" || e.key === "j" || e.key === "J") {
    e.preventDefault();
    nextFeedCard();
  } else if (e.key === "ArrowUp" || e.key === "k" || e.key === "K") {
    e.preventDefault();
    prevFeedCard();
  } else if (e.code === "Space") {
    e.preventDefault();
    const abtn = $("feedAudioBtn");
    if (abtn) abtn.click();
    else {
      feedTrickOpen = !feedTrickOpen;
      renderFeed();
    }
  } else if (e.key >= "0" && e.key <= "9") {
    const idx = parseInt(e.key, 10);
    const courses = activeCourses();
    if (idx === 0) {
      feedCourse = "";
      store.set("feedCourse", "");
      loadFeed();
    } else if (idx <= courses.length) {
      feedCourse = String(courses[idx - 1].id);
      store.set("feedCourse", feedCourse);
      loadFeed();
    }
  }
});

            <div style="display:flex;justify-content:flex-end;margin-top:4px">
              <button class="btn primary sm" data-xray-train="${xrayCourse}" data-arch-title="${esc(ex.titolo || '')}">✍️ Mettiti alla prova su questo Archetipo</button>
            </div>
          </div>
        </div>
      `;
      }).join("")}
    </div>
  `;

  bindXRayChips(body);

  // Toggle per comprimere/espandere i singoli archetipi
  body.querySelectorAll("[data-xray-toggle]").forEach(hd => {
    hd.addEventListener("click", () => {
      const idx = hd.dataset.xrayToggle;
      const b = $("xrayBody_" + idx);
      const arrow = $("xrayArrow_" + idx);
      if (b) {
        const isHidden = b.style.display === "none";
        b.style.display = isHidden ? "grid" : "none";
        if (arrow) arrow.textContent = isHidden ? "▼" : "▶";
      }
    });
  });

  // Pulsante simula esame
  $("xraySimBtn")?.addEventListener("click", async () => {
    try {
      body.innerHTML = '<div class="muted" style="text-align:center;padding:40px"><span class="spin"></span> Generazione simulazione dell\'esame in corso...</div>';
      const sim = await postJ(`/api/courses/${xrayCourse}/exam/sims`, {});
      setView("study");
    } catch (e) {
      alert("Simulazione non ancora pronta: " + e.message);
      loadXRay();
    }
  });

  body.querySelectorAll("[data-xray-train]").forEach(btn => {
    btn.onclick = () => {
      const archTitle = btn.dataset.archTitle;
      store.set("studyCourse", xrayCourse);
      setView("study");
    };
  });
}

function bindXRayChips(root) {
  root.querySelectorAll("[data-xc]").forEach(btn => {
    btn.onclick = () => {
      xrayCourse = btn.dataset.xc;
      store.set("xrayCourse", xrayCourse);
      loadXRay();
    };
  });
}

// Keyboard shortcuts for X-Ray
document.addEventListener("keydown", (e) => {
  if (view !== "xray" || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (e.key >= "1" && e.key <= "9") {
    const idx = parseInt(e.key, 10);
    const courses = activeCourses();
    if (idx <= courses.length) {
      xrayCourse = String(courses[idx - 1].id);
      store.set("xrayCourse", xrayCourse);
      loadXRay();
    }
  }
});


// ============================================================== POMODORO TIMER
const POMO_CIRC = 2 * Math.PI * 120;
let pomoState = {
  running: false, phase: 'study', timeLeft: 25 * 60, totalTime: 25 * 60, interval: null,
  completed: store.get('pomoToday', { count: 0, date: '', minutes: 0 }),
  studyMin: store.get('pomoStudy', 25), breakMin: store.get('pomoBreak', 5), longBreakMin: store.get('pomoLong', 15),
};
if (pomoState.completed.date !== new Date().toISOString().slice(0, 10))
  pomoState.completed = { count: 0, date: new Date().toISOString().slice(0, 10), minutes: 0 };
pomoState.timeLeft = pomoState.studyMin * 60; pomoState.totalTime = pomoState.studyMin * 60;

function pomoBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.3, 0.6].forEach((delay) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = pomoState.phase === 'study' ? [523, 659, 784][Math.round(delay / 0.3)] : [784, 659, 523][Math.round(delay / 0.3)];
      gain.gain.setValueAtTime(0.25, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.8);
      osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 0.8);
    });
  } catch {}
  // Browser notification if tab hidden
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    const msg = pomoState.phase === 'study' ? '🍅 Pomodoro completato! Pausa.' : '⏰ Pausa finita! Studia.';
    new Notification('StudyHub', { body: msg, icon: '/favicon.png' });
  }
}

function pomoTick() {
  const p = pomoState;
  p.timeLeft--;
  // Update document title with timer
  const m = Math.floor(p.timeLeft / 60), s = p.timeLeft % 60;
  document.title = `${m}:${String(s).padStart(2, '0')} ${p.phase === 'study' ? '📚' : '☕'} StudyHub`;
  // Update nav indicator
  const navT = $("pomoNavTime");
  if (navT) navT.textContent = `${m}:${String(s).padStart(2, '0')}`;
  if (p.timeLeft <= 0) {
    clearInterval(p.interval); p.running = false;
    pomoBeep();
    if (p.phase === 'study') {
      p.completed.count++; p.completed.minutes += p.studyMin;
      p.completed.date = new Date().toISOString().slice(0, 10);
      store.set('pomoToday', p.completed);
      toast(`🍅 Pomodoro #${p.completed.count} completato! Tempo di pausa.`, 'ok');
      if (p.completed.count % 4 === 0) {
        p.phase = 'long_break'; p.timeLeft = p.longBreakMin * 60; p.totalTime = p.longBreakMin * 60;
      } else {
        p.phase = 'break'; p.timeLeft = p.breakMin * 60; p.totalTime = p.breakMin * 60;
      }
    } else {
      toast('⏰ Pausa finita! Torna a studiare.', 'info');
      p.phase = 'study'; p.timeLeft = p.studyMin * 60; p.totalTime = p.studyMin * 60;
    }
    document.title = 'StudyHub';
    const navT = $("pomoNavTime"); if (navT) navT.textContent = '';
  }
  if (view === 'pomodoro') renderPomo();
}

function pomoToggle() {
  const p = pomoState;
  if (p.running) {
    clearInterval(p.interval); p.running = false; document.title = 'StudyHub';
    const navT = $("pomoNavTime"); if (navT) navT.textContent = '';
  } else {
    // Ask notification permission on first start
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    p.running = true;
    p.interval = setInterval(pomoTick, 1000);
  }
  renderPomo();
}

function pomoReset() {
  const p = pomoState;
  clearInterval(p.interval); p.running = false; p.phase = 'study';
  p.timeLeft = p.studyMin * 60; p.totalTime = p.studyMin * 60;
  document.title = 'StudyHub';
  const navT = $("pomoNavTime"); if (navT) navT.textContent = '';
  renderPomo();
}

function pomoSkip() {
  const p = pomoState;
  clearInterval(p.interval); p.running = false;
  if (p.phase === 'study') {
    const isLong = p.completed.count > 0 && p.completed.count % 4 === 3;
    p.phase = isLong ? 'long_break' : 'break';
    p.timeLeft = (isLong ? p.longBreakMin : p.breakMin) * 60;
    p.totalTime = p.timeLeft;
  } else {
    p.phase = 'study'; p.timeLeft = p.studyMin * 60; p.totalTime = p.studyMin * 60;
  }
  document.title = 'StudyHub';
  const navT = $("pomoNavTime"); if (navT) navT.textContent = '';
  renderPomo();
}

const POMO_TIPS = [
  'Chiudi le notifiche del telefono durante lo studio.',
  'Bevi un bicchiere d\'acqua ad ogni pausa.',
  'Dopo 4 pomodori, fai una pausa lunga di 15 minuti.',
  'Scrivi cosa vuoi fare PRIMA di avviare il timer.',
  'Se ti viene un\'idea, annotala e torna a studiare.',
  'Alzati e stretcha durante le pause!',
  'Se 25 minuti sono troppi, inizia con 15.',
  'L\'obiettivo non è la perfezione, è la costanza.',
];

function renderPomo() {
  const body = $("pomoBody"); if (!body) return;
  const p = pomoState, m = Math.floor(p.timeLeft / 60), s = p.timeLeft % 60;
  const timeStr = `${m}:${String(s).padStart(2, '0')}`;
  const progress = 1 - (p.timeLeft / p.totalTime);
  const offset = POMO_CIRC * (1 - progress);
  const phCls = p.phase === 'study' ? 'study' : 'brk';
  const phLabel = p.phase === 'study' ? '📚 Studio' : p.phase === 'long_break' ? '🏖️ Pausa lunga' : '☕ Pausa';
  const phMsg = p.phase === 'study'
    ? (p.running ? 'Concentrati! Niente distrazioni.' : 'Pronto per studiare?')
    : (p.running ? 'Rilassati, te lo meriti!' : p.phase === 'long_break' ? 'Hai fatto 4 pomodori! Riposati bene.' : 'Pronto per la pausa?');
  const cyclePos = p.completed.count % 4;
  const dots = Array.from({length: 4}, (_, i) => {
    if (i < cyclePos) return '<i class="done"></i>';
    if (i === cyclePos && p.phase === 'study') return `<i class="${p.running ? 'active' : ''}"></i>`;
    return '<i></i>';
  }).join('');
  const tip = POMO_TIPS[p.completed.count % POMO_TIPS.length];
  const goalPct = Math.min(100, Math.round(p.completed.count / 8 * 100));

  body.innerHTML = `
    <div class="pomo-timer">
      <svg class="pomo-svg" viewBox="0 0 260 260">
        <circle class="track" cx="130" cy="130" r="120"/>
        <circle class="progress ${phCls}" cx="130" cy="130" r="120"
          stroke-dasharray="${POMO_CIRC}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="pomo-center">
        <div>
          <div class="pomo-time">${timeStr}</div>
          <div class="pomo-phase ${phCls}">${phLabel}</div>
        </div>
      </div>
    </div>
    <div class="pomo-dots">${dots}</div>
    <div class="pomo-msg">${esc(phMsg)}</div>
    <div class="pomo-controls">
      <button class="pomo-btn" id="pomoSkip" title="Salta alla fase successiva">⏭</button>
      <button class="pomo-btn main ${p.running ? 'running' : ''}" id="pomoToggle" title="${p.running ? 'Pausa' : 'Avvia'}">${p.running ? '❚❚' : '▶'}</button>
      <button class="pomo-btn" id="pomoReset" title="Ricomincia da capo">↺</button>
    </div>
    <div class="pomo-stats">
      <div class="card pomo-stat"><div class="k">Pomodori oggi</div><div class="v">🍅 ${p.completed.count}</div></div>
      <div class="card pomo-stat"><div class="k">Minuti studio</div><div class="v">${p.completed.minutes}</div></div>
      <div class="card pomo-stat"><div class="k">Obiettivo giornaliero</div><div class="v">${p.completed.count >= 8 ? '✅' : goalPct + '%'}</div>
        <div class="meter" style="margin-top:6px"><i style="width:${goalPct}%"></i></div></div>
    </div>
    <div class="pomo-config">
      <label>Studio <input type="number" id="cfgStudy" value="${p.studyMin}" min="1" max="90"> min</label>
      <label>Pausa <input type="number" id="cfgBreak" value="${p.breakMin}" min="1" max="30"> min</label>
      <label>Pausa lunga <input type="number" id="cfgLong" value="${p.longBreakMin}" min="1" max="60"> min</label>
    </div>
    <div class="pomo-tip"><b>💡 Consiglio:</b> ${esc(tip)}</div>`;
  $("pomoToggle").onclick = pomoToggle;
  $("pomoReset").onclick = () => { if (p.running && !confirm('Vuoi resettare il timer?')) return; pomoReset(); };
  $("pomoSkip").onclick = pomoSkip;
  const cfgHandler = (id, key, phase, min, max) => {
    $(id).onchange = (e) => { const v = Math.max(min, Math.min(max, +e.target.value || pomoState[key]));
      pomoState[key] = v; store.set({studyMin:'pomoStudy',breakMin:'pomoBreak',longBreakMin:'pomoLong'}[key], v);
      if (!p.running && ((key === 'studyMin' && p.phase === 'study') || (key === 'breakMin' && p.phase === 'break') || (key === 'longBreakMin' && p.phase === 'long_break')))
        { p.timeLeft = v * 60; p.totalTime = v * 60; renderPomo(); } };
  };
  cfgHandler('cfgStudy', 'studyMin', 'study', 1, 90);
  cfgHandler('cfgBreak', 'breakMin', 'break', 1, 30);
  cfgHandler('cfgLong', 'longBreakMin', 'long_break', 1, 60);
}
// Keyboard: Space to start/pause Pomodoro
document.addEventListener("keydown", (e) => {
  if (view !== "pomodoro" || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); pomoToggle(); }
  else if (e.key === "r" || e.key === "R") { if (!pomoState.running) pomoReset(); }
  else if (e.key === "s" || e.key === "S") pomoSkip();
});

// ============================================================== avvio
(async () => {
  setTheme(getTheme());
  $("btnThemeToggle")?.addEventListener("click", cycleTheme);
  COURSES = await getJ("/api/courses");
  setView("study");  // l'app si apre sempre su Studia (corso e punto in cui eri restano ricordati)
  refreshFoot(); setInterval(refreshFoot, 60000);
})();
</script>
