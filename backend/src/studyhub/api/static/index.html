  } else if (job) {
    $("p-notes").innerHTML = `<div class="cta"><b>${job.status === "in_corso" ? "⏳ Claude sta elaborando la lezione" : "In coda"}</b><p>Di solito 1-3 minuti.${st.paused_reason ? " Coda in pausa: " + esc(st.paused_reason) : ""}</p></div>`;
  } else {
    $("p-notes").innerHTML = `<div class="cta"><b>Appunti non ancora generati</b><p>Claude legge trascrizione e appunti scritti e prepara appunti, flashcard e domande. Circa il 5-7% della finestra di 5 ore.</p>
      ${err ? `<p class="small" style="color:var(--warn)">Ultimo tentativo fallito: ${esc(err.message || "")}</p>` : ""}<button class="btn primary" id="gen">Genera appunti</button></div>`;
    $("gen").onclick = async () => { await postJ(`/api/lectures/${id}/notes`); loadNotes(); };
  }
  $("p-notes").querySelectorAll("[data-learn-t]").forEach((c) => (c.onclick = () => { setView("study"); openLesson(+c.dataset.learnT); }));
  clearTimeout(loadNotes.timer);
  if (job) loadNotes.timer = setTimeout(() => { loadNotes(); refreshFoot(); if (view === "lessons") loadLectureList(); }, 4000);
}

// --- Quiz della lezione
async function loadQuiz() {
  if (!lec) { $("p-quiz").innerHTML = '<div class="empty">Apri una lezione.</div>'; return; }
  const id = lec.id, list = await getJ(`/api/lectures/${id}/quizzes`);
  if (!lec || lec.id !== id) return;
  $("p-quiz").innerHTML = (list.length ? list.map((q) => `<div class="qitem" data-q="${q.id}"><span>${esc(q.title)}</span><span class="muted small">${q.best != null ? Math.round(q.best * 100) + "%" : "da fare"}</span></div>`).join("") : "") +
    `<div class="cta"><b>Quiz di 10 domande</b><p>Generato dagli appunti AI. Crocette corrette in locale, risposte aperte con Haiku.</p><button class="btn primary" id="qGen">Genera quiz</button></div>`;
  $("qGen").onclick = async () => { $("qGen").disabled = true; $("qGen").textContent = "⏳ Preparo le domande…";
    try { const r = await postJ(`/api/lectures/${id}/quiz?n=10`); openQuiz(r.id); } catch (e) { alert(e.message); loadQuiz(); } };
  $("p-quiz").querySelectorAll("[data-q]").forEach((el) => (el.onclick = () => openQuiz(+el.dataset.q)));
}
async function openQuiz(qid) {
  const q = await getJ(`/api/quizzes/${qid}`), box = $("p-quiz");
  box.innerHTML = `<p><button class="btn sm ghost" id="qBack">← Quiz</button></p><h3>${esc(q.title)}</h3>` + q.questions.map((d, i) => {
    const body = d.tipo === "multipla" ? d.opzioni.map((o, j) => `<label><input type="radio" name="q${i}" value="${j}"><span>${mdInline(o)}</span></label>`).join("")
      : d.tipo === "vero_falso" ? `<label><input type="radio" name="q${i}" value="1"> Vero</label><label><input type="radio" name="q${i}" value="0"> Falso</label>`
      : `<textarea name="q${i}" rows="${d.tipo === "esercizio" ? 5 : 3}" placeholder="La tua risposta"></textarea>`;
    return `<div class="q" id="qq${i}"><div class="muted small">${i + 1} · ${d.tipo.replace("_", "/")}</div><div class="md">${md(d.testo_md)}</div>${body}</div>`;
  }).join("") + `<button class="btn primary" id="qSubmit">Consegna</button>`;
  $("qBack").onclick = loadQuiz;
  $("qSubmit").onclick = async () => {
    const answers = q.questions.map((d, i) => d.tipo === "multipla" || d.tipo === "vero_falso"
      ? ((c) => (c ? +c.value : null))(box.querySelector(`input[name=q${i}]:checked`)) : box.querySelector(`textarea[name=q${i}]`).value);
    $("qSubmit").disabled = true; $("qSubmit").textContent = "⏳ Correggo…";
    try {
      const r = await postJ(`/api/quizzes/${qid}/submit`, { answers });
      r.results.forEach((res, i) => { const el = $("qq" + i), d = q.questions[i];
        el.classList.add(res.punteggio >= 0.99 ? "ok" : "ko");
        el.insertAdjacentHTML("beforeend", `<div class="fb md"><b>${res.punteggio >= 0.99 ? "Corretta" : res.punteggio > 0 ? res.punteggio + " punti" : "Sbagliata"}</b>` +
          (d.tipo === "multipla" && res.corretta >= 0 ? ` · giusta: ${String.fromCharCode(65 + res.corretta)}` : "") + (d.tipo === "vero_falso" ? ` · era ${res.corretta ? "vero" : "falso"}` : "") +
          (res.feedback_md ? md(res.feedback_md) : "") + md(res.soluzione_md) + (d.inizio_s != null ? ` <span class="ts" data-t="${d.inizio_s}">▶ ${fmt(d.inizio_s)}</span>` : "") + "</div>"); });
      $("qSubmit").outerHTML = `<div class="card" style="padding:14px"><b>${r.score} / ${r.max_score}</b> · ${Math.round(100 * r.score / r.max_score)}%</div>`;
    } catch (e) { alert(e.message); $("qSubmit").disabled = false; $("qSubmit").textContent = "Consegna"; }
  };
}

// ============================================================== TUTOR
let tThread = null, tInit = false, tMode = store.get("tMode", "normale");
const EXAMPLES = ["Spiegami il teorema dei residui con un esempio", "Qual è la differenza tra media e mediana?", "Come si trova una base di U∩V?"];
function setMode(m) { tMode = m; store.set("tMode", m); $("tMode").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.mode === m)); }
async function initTutor() {
  if (!tInit) {
    tInit = true;
    $("tCourse").innerHTML = '<option value="">Tutti i corsi</option>' + activeCourses().map((c) => `<option value="${c.id}">${esc(shortName(c.fullname))}</option>`).join("");
    $("tCourse").value = store.get("tCourse", "");
    $("tCourse").onchange = () => { store.set("tCourse", $("tCourse").value); tThread = null; renderChat(null); };
    $("tMode").onclick = (e) => { const b = e.target.closest("button"); if (b) { setMode(b.dataset.mode); tThread = null; renderChat(null); } };
    setMode(tMode);
    $("tNew").onclick = () => { tThread = null; renderChat(null); $("tQ").focus(); };
    $("tThreads").onchange = async () => { const id = $("tThreads").value; if (id) { tThread = await getJ(`/api/tutor/threads/${id}`); renderChat(tThread); } };
    $("tForm").onsubmit = (e) => { e.preventDefault(); askTutor(); };
    $("tQ").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); askTutor(); } };
    $("tChat").onclick = (e) => { const c = e.target.closest("[data-src]"); if (c && c._src) openSource(c._src);
      const ex = e.target.closest("[data-ex]"); if (ex) { $("tQ").value = ex.dataset.ex; askTutor(); } };
    renderChat(null);
  }
  const ths = await getJ("/api/tutor/threads");
  $("tThreads").innerHTML = '<option value="">Conversazioni…</option>' + ths.filter((t) => t.n).map((t) => `<option value="${t.id}">${esc((t.title || "Senza titolo").slice(0, 50))}</option>`).join("");
}
function botBubble(text, sources, cited, outside) {
  const box = document.createElement("div"); box.className = "msg bot md";
  box.innerHTML = (outside ? '<div class="small" style="color:var(--warn)">Il materiale del corso non copre del tutto la domanda.</div>' : "") +
    md(text).replace(/\[(\d{1,2})\]/g, (m, n) => sources.find((s) => s.n === +n) ? `<span class="cite" data-src="${n}">${n}</span>` : m);
  const used = sources.filter((s) => cited.includes(s.n));
  if (used.length) box.insertAdjacentHTML("beforeend", `<div class="srcs">${used.map((s) => `<a data-src="${s.n}">[${s.n}] ${esc(s.title || "")} · ${esc(s.where)}</a>`).join("")}</div>`);
  box.querySelectorAll("[data-src]").forEach((el) => (el._src = sources.find((s) => s.n === +el.dataset.src)));
  return box;
}
function renderChat(th) {
  const chat = $("tChat"); chat.innerHTML = "";
  if (!th || !th.messages.length) {
    chat.innerHTML = `<div class="empty" style="margin:auto"><div style="font-size:15px;color:var(--ink);font-weight:600">Chiedi al tuo materiale</div>
      <p>Risponde solo da appunti, PDF e trascrizioni, con le fonti cliccabili.${tMode === "socratico" ? " In modalità socratica ti guida con domande." : ""}</p>
      <div class="suggest">${EXAMPLES.map((e) => `<button class="btn sm" data-ex="${esc(e)}">${esc(e)}</button>`).join("")}</div></div>`;
    return;
  }
  for (const m of th.messages) {
    if (m.role === "user") { const d = document.createElement("div"); d.className = "msg user"; d.textContent = m.content; chat.append(d); }
    else chat.append(botBubble(m.content, m.citations, [...m.content.matchAll(/\[(\d{1,2})\]/g)].map((x) => +x[1])));
  }
  chat.scrollTop = chat.scrollHeight;
}
async function askTutor() {
  const q = $("tQ").value.trim(); if (!q || $("tSend").disabled) return;
  $("tSend").disabled = true; $("tQ").value = "";
  const chat = $("tChat");
  if (chat.querySelector(".empty")) chat.innerHTML = "";
  const u = document.createElement("div"); u.className = "msg user"; u.textContent = q; chat.append(u);
  const wait = document.createElement("div"); wait.className = "msg bot muted"; wait.textContent = "Cerco nel materiale…"; chat.append(wait);
  chat.scrollTop = chat.scrollHeight;
  try {
    if (!tThread) { const cid = $("tCourse").value; tThread = await postJ("/api/tutor/threads", { course_id: cid ? +cid : null, mode: tMode }); }
    const r = await postJ(`/api/tutor/threads/${tThread.id}/ask`, { question: q });
    wait.replaceWith(botBubble(r.answer, r.sources, r.cited, r.outside));
    tThread = await getJ(`/api/tutor/threads/${tThread.id}`);
    refreshFoot();
  } catch (e) { wait.className = "msg bot"; wait.innerHTML = `<span style="color:var(--warn)">${esc(e.message)}</span>`; $("tQ").value = q; }
  finally { $("tSend").disabled = false; chat.scrollTop = chat.scrollHeight; }
}

// ============================================================== RIPASSO (FSRS)
let rCards = [], rDone = 0, rCourse = store.get("rCourse", "");
async function loadReview() {
  const r = await getJ("/api/flashcards/due" + (rCourse ? "?course_id=" + rCourse : ""));
  rCards = r.cards; rDone = 0;
  $("subtitle").textContent = `${r.stats.da_ripassare} da ripassare · ${r.stats.totale} carte`;
  showCard(false);
}
function showCard(revealed) {
  const c = rCards[0], total = rDone + rCards.length;
  const opts = '<option value="">Tutti i corsi</option>' + activeCourses().map((x) => `<option value="${x.id}" ${String(x.id) === String(rCourse) ? "selected" : ""}>${esc(shortName(x.fullname))}</option>`).join("");
  const head = `<div class="progress"><select class="sel" id="rCourse">${opts}</select><div class="meter" style="flex:1"><i style="width:${total ? 100 * rDone / total : 0}%"></i></div><span class="muted small">${rDone}/${total}</span></div>`;
  if (!c) {
    $("reviewBody").innerHTML = head + `<div class="card flash" style="align-items:center;justify-content:center;text-align:center"><div style="font-size:18px;font-weight:600">Tutto ripassato</div>
      <div class="muted">Le carte nascono dagli appunti AI delle lezioni.</div><div class="small"><a href="/api/flashcards/anki.apkg${rCourse ? "?course_id=" + rCourse : ""}">Esporta per Anki</a></div></div>`;
  } else {
    $("reviewBody").innerHTML = head + `<div class="card flash">
      ${c.lecture_id ? `<a class="small" id="rSrc">${esc(c.lecture_title || "lezione")}${c.t_start != null ? " · ▶ " + fmt(c.t_start) : ""}</a>` : ""}
      <div class="md" style="font-size:16px">${md(c.front)}</div>${revealed ? `<hr><div class="md">${md(c.back)}</div>` : ""}</div>` +
      (revealed ? `<div class="rates"><button class="btn" data-r="1">Di nuovo <span class="faint">1</span></button><button class="btn" data-r="2">Difficile <span class="faint">2</span></button><button class="btn primary" data-r="3">Bene <span class="faint">3</span></button><button class="btn" data-r="4">Facile <span class="faint">4</span></button></div>`
        : `<button class="btn primary" id="rShow" style="padding:11px">Mostra risposta <span style="opacity:.7">(spazio)</span></button>`);
    $("rShow")?.addEventListener("click", () => showCard(true));
    $("reviewBody").querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => rate(+b.dataset.r)));
    $("rSrc")?.addEventListener("click", () => setView("lessons", { lecture: c.lecture_id, t: c.t_start ?? 0 }));
  }
  $("rCourse").onchange = () => { rCourse = $("rCourse").value; store.set("rCourse", rCourse); loadReview(); };
}
async function rate(r) {
  const c = rCards.shift(); if (!c) return;
  const res = await postJ(`/api/flashcards/${c.id}/review`, { rating: r });
  if (new Date(res.due) <= new Date(Date.now() + 10 * 60 * 1000)) rCards.push({ ...c, due: res.due }); else rDone++;
  showCard(false); refreshFoot();
}
document.addEventListener("keydown", (e) => {
  if (view !== "review" || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); if ($("rShow")) showCard(true); }
  else if (["1", "2", "3", "4"].includes(e.key) && !$("rShow") && rCards.length) rate(+e.key);
});

// ============================================================== visualizzatore PDF
let vDoc = null, vPage = 1, vPages = 1;
async function openViewer(docId, page, title) {
  const d = await getJ(`/api/docs/${docId}`);
  vDoc = docId; vPages = d.n_pages || 1; $("vTitle").textContent = title || d.title;
  showPage(page); $("viewer").hidden = false;
}
function showPage(p) { vPage = Math.min(vPages, Math.max(1, p)); $("vImg").src = `/api/docs/${vDoc}/page/${vPage}.png`;
  $("vPage").textContent = `${vPage} / ${vPages}`; $("vOpen").href = `/api/docs/${vDoc}/file#page=${vPage}`; }
$("vPrev").onclick = () => showPage(vPage - 1); $("vNext").onclick = () => showPage(vPage + 1);
$("vClose").onclick = () => ($("viewer").hidden = true);
$("viewer").onclick = (e) => { if (e.target.id === "viewer") $("viewer").hidden = true; };
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (!$("viewer").hidden) $("viewer").hidden = true; else if (!$("drawer").hidden) closeDrawer(); }
  if (!$("viewer").hidden && (e.key === "PageDown" || e.key === "ArrowRight")) showPage(vPage + 1);
  if (!$("viewer").hidden && (e.key === "PageUp" || e.key === "ArrowLeft")) showPage(vPage - 1);
});

// ============================================================== avvio
(async () => {
  COURSES = await getJ("/api/courses");
  setView("study");  // l'app si apre sempre su Studia (corso e punto in cui eri restano ricordati)
  refreshFoot(); setInterval(refreshFoot, 60000);
})();
